[project]
name = "career-application-assistant"
version = "0.1.0"
description = "Privacy-first local job application board with a fixed SQLite data layer."
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11,<4",
    "beautifulsoup4>=4.13,<5",
    "dateparser>=1.2,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "imapclient>=3,<4",
    "msal>=1.33,<2",
    "msal-extensions>=1.3,<2",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3",
    "pywin32>=308; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["app/tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
